    <body>
        <style>
            /* Internal CSS */
        </style>
        <button>Button 2</button>
        <input type="text" />
        <button id="mybtn">Click Me</button>
        <script>
            // Internal JS
            // console.log("Hello from JS");
            function myFunc() {
                console.log("Hello from JS");
            }

			{
				const mybutton = document.getElementById("mybtn");
			}
            // mybutton.addEventListener("click", myFunc);

            document.getElementById("mybtn").addEventListener("click", myFunc);

            // eventlistener needs 2 things (params)
            // 1. which event
            // 2. what to do (a. define a function, b. directly say what to do)
        </script>
    </body>
